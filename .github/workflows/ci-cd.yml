# CI/CD for the chat portfolio.
# CI: on every push and pull request to main, install, test and build both apps.
# CD: only after CI passes on a push to main, ask Render to redeploy (deploy hooks).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: Vite 8 needs Node 20.19+ or 22.12+
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tests use a mocked AI call and no database, so no secrets are needed here
      - name: Server - install and test
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Client - install, typecheck and build
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run build

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Hook URLs are GitHub repo secrets (Settings > Secrets and variables > Actions).
      # Spaces / line breaks pasted with the secret are removed first, then:
      # not set -> skip; set -> POST to it (-f makes an HTTP error fail the step).
      # The hook URL is never printed; curl's response goes to /dev/null.
      - name: Deploy backend (Render)
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          if [ -z "$HOOK" ]; then echo "RENDER_BACKEND_HOOK not set - skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Backend deploy triggered"

      - name: Deploy frontend (Render)
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          if [ -z "$HOOK" ]; then echo "RENDER_FRONTEND_HOOK not set - skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Frontend deploy triggered"
